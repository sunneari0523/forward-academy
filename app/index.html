<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>포워드 · 나의 공부 플래너</title>
<meta name="theme-color" content="#D68FA5">
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF8F9;--card:#fff;--ink:#5B3F4C;--text:#4A3A40;--muted:#8E7C82;--line:#F2E4E8;
  --navy:#D68FA5;--navy2:#EBB3C3;--navy-soft:#FCEEF2;
  --sage:#7A9B80;--sage-d:#5C7F64;--sage-soft:#E6F0E7;
  --butter:#F4CF72;--butter-soft:#FFF5DA;--peach:#F2A988;--peach-soft:#FCEAE1;--red:#D0603F;
  --shadow:0 10px 28px -14px rgba(200,120,150,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.jua{font-family:'Jua',sans-serif;font-weight:400}
.hide{display:none!important}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;transition:transform .1s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-navy{background:var(--navy);color:#fff}
.btn-sage{background:var(--sage);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-soft{background:var(--sage-soft);color:var(--sage-d)}
.btn-warn{background:var(--peach-soft);color:var(--red)}
.btn-sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.c-todo{background:var(--navy-soft);color:var(--navy2)}
.c-sub{background:var(--butter-soft);color:#946A0A}
.c-ok{background:var(--sage-soft);color:var(--sage-d)}
.c-redo{background:var(--peach-soft);color:var(--red)}
.c-voca{background:#EFE8FB;color:#6A4FB8}
input.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--sage)}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.demo-bar{background:var(--butter-soft);color:#7A5600;font-size:12.5px;text-align:center;padding:6px 10px;font-weight:500}
.demo-bar b{font-weight:700}
.sync{position:fixed;right:12px;bottom:12px;z-index:50;background:#fff;border:1px solid #e3e8e4;border-radius:999px;padding:5px 11px;font-size:12px;color:#5b7a62;box-shadow:0 2px 8px rgba(0,0,0,.06);pointer-events:none;transition:opacity .3s}
.sync.ok{opacity:.55}.sync.busy{color:#7A5600;opacity:1}.sync.err{color:#c0392b;border-color:#f3c2b8;opacity:1}
@media(max-width:700px){.sync{bottom:78px}}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 10%,var(--sage-soft) 0,transparent 40%),radial-gradient(circle at 0% 100%,var(--navy-soft) 0,transparent 45%),var(--bg)}
.login-box{width:100%;max-width:420px}
.login-box .logo{height:40px;margin:0 auto 26px;display:block}
.login h1{font-size:30px;color:var(--ink);text-align:center;line-height:1.3}
.login p.sub{text-align:center;color:var(--muted);margin:8px 0 22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#E8EEE8;border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.quick{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.quick .t{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700}
.quick .list{display:flex;flex-wrap:wrap;gap:6px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.quick button:hover{border-color:var(--sage)}
.err{color:var(--red);font-size:13.5px;margin-top:10px;text-align:center;min-height:18px}

/* ---------- STUDENT ---------- */
.s-wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}
.s-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
.s-top .who{display:flex;align-items:center;gap:10px}
.s-top img{height:30px}
.s-top b{color:var(--ink);font-size:17px}
.s-top small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.sdcard{text-align:center;padding:22px 16px}.sdcard.run{border:2px solid var(--navy);background:var(--navy-soft)}
.sdclock{font-size:clamp(46px,14vw,72px);font-weight:800;letter-spacing:2px;color:var(--ink);font-variant-numeric:tabular-nums;margin:14px 0}
.sdbtn{font-size:19px;padding:14px 34px;min-width:220px;justify-content:center}
.sdsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sdsum>div{background:var(--card,#fff);border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.04)}.sdsum small{display:block;color:var(--muted,#888);font-size:12px}.sdsum b{font-size:17px;color:var(--ink)}
.sdcard.pz{border:2px dashed var(--sage);background:var(--sage-soft)}.sdbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.sdbtns .sdbtn{min-width:150px}
.sunletter{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;text-align:center;padding:6px 4px}.sl-top{font-size:40px}.sl-to{font-size:18px;color:var(--navy);margin:6px 0 14px;line-height:1.4}.sl-body{background:var(--navy-soft);border-radius:16px;padding:18px 16px;font-size:15.5px;line-height:1.85;color:var(--ink);font-weight:600;max-height:58vh;overflow:auto}.sl-sign{text-align:right;margin-top:10px;color:var(--muted,#888);font-size:13px}
.sdbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:150px;align-items:end}.sdbars .b{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}.sdbars i{display:block;width:70%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--sage)}.sdbars small{font-size:10.5px;color:var(--ink);font-weight:700;white-space:nowrap}.sdbars span{font-size:12px;color:var(--muted,#888)}
.bnav .in{display:grid;grid-template-columns:repeat(var(--n),1fr);width:100%;max-width:560px}
.bnav button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted);position:relative}
.bnav button .i{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.6}
.bnav button.on{color:var(--ink)}
.bnav button.on .i{filter:none;opacity:1}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* pet card */
.petcard{border-radius:24px;overflow:hidden;position:relative;height:230px;margin-bottom:14px;transition:background 1s;background:linear-gradient(180deg,#DDEFF5 0%,#EAF4EA 64%,#CFE3D2 64%,#C2DBC6 100%)}
.petcard.m-hungry{background:linear-gradient(180deg,#F5E7CF 0%,#F7EEDC 64%,#E6D7B8 64%,#DCCBA8 100%)}
.petcard.m-weak{background:linear-gradient(180deg,#D9DEE6 0%,#E4E7EC 64%,#C9CED6 64%,#BCC2CB 100%)}
.petcard.m-rescue{background:linear-gradient(180deg,#3B4A5E 0%,#4A5870 64%,#36414F 64%,#2E3844 100%)}
.petcard .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:4}
.petcard .hud span{background:rgba(255,255,255,.93);color:var(--ink);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.petcard .photo{position:absolute;left:22px;bottom:20px;width:150px;height:150px;cursor:pointer;z-index:3;transform:rotate(-3deg)}
.petcard .photo .fr{width:100%;height:100%;border-radius:28px;overflow:hidden;border:5px solid #fff;box-shadow:0 12px 24px -10px rgba(200,120,150,.55);background:#fff}
.petcard .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .8s,transform .4s}
.petcard .photo .acc{position:absolute;font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));transition:opacity .4s}
.petcard .photo .crown{top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:36px}
.petcard .photo .scarf{bottom:-12px;right:-10px}
.petcard .photo .zz{position:absolute;top:-6px;right:-14px;font-weight:900;color:#fff;font-size:20px;animation:zz 2.4s ease-in-out infinite;text-shadow:0 2px 6px rgba(0,0,0,.4)}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.8)}40%{opacity:1}100%{opacity:0;transform:translate(10px,-22px) scale(1.2)}}
.photo.m-happy{animation:pbob 3s ease-in-out infinite}
@keyframes pbob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
.photo.m-hungry{animation:pshake 2.8s ease-in-out infinite}
@keyframes pshake{0%,70%,100%{transform:rotate(-3deg)}74%{transform:rotate(-8deg)}78%{transform:rotate(3deg)}82%{transform:rotate(-7deg)}86%{transform:rotate(1deg)}}
.photo.m-weak{transform:rotate(-6deg) translateY(10px)}
.photo.m-weak img{filter:saturate(.35) brightness(.95)}
.photo.m-rescue{animation:pshiver .3s linear infinite}
@keyframes pshiver{0%,100%{transform:rotate(-3deg) translateX(0)}50%{transform:rotate(-3deg) translateX(1.5px)}}
.photo.m-rescue img{filter:grayscale(.75) brightness(.8)}
.photo.m-sleep{animation:pbreath 4s ease-in-out infinite}
@keyframes pbreath{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-3deg) scale(1.03)}}
.photo.bump{animation:pbump .5s ease}
@keyframes pbump{0%{transform:rotate(-3deg) scale(1)}40%{transform:rotate(2deg) scale(1.08)}100%{transform:rotate(-3deg) scale(1)}}
.petcard .rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;z-index:1}
.petcard.m-rescue .rain{opacity:1}
.petcard .rain i{position:absolute;top:-20px;width:2px;height:14px;background:rgba(200,220,255,.5);border-radius:2px;animation:rfall 1s linear infinite}
@keyframes rfall{to{transform:translateY(260px)}}
.petcard.night{background:linear-gradient(180deg,#22344A 0%,#2E4560 64%,#26384C 64%,#1F2F40 100%)}
.petcard.night .talk::before{border-right-color:#fff}
.petcard.night .xp small{color:#fff}
.petcard .talk{position:absolute;left:192px;right:14px;bottom:96px;background:#fff;border-radius:16px;padding:10px 13px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--shadow);z-index:4}
.petcard .talk::before{content:"";position:absolute;left:-7px;bottom:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.petcard .xp{position:absolute;left:192px;right:14px;bottom:30px;z-index:4}
.petcard .xp .bar{height:10px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden}
.petcard .xp .bar i{display:block;height:100%;background:var(--butter);border-radius:99px;transition:width .6s}
.petcard .xp small{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-top:4px;opacity:.75}
.m-rescue .xp small{color:#fff}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fx{position:absolute;font-size:22px;animation:floatUp 1.4s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-110px)}}
.confetti{position:absolute;width:8px;height:12px;border-radius:2px;animation:conf 1.5s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}

/* cat anim (shared) */
.pet #tail{transform-origin:168px 178px;animation:wag 1.1s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.pet #catBody{transform-origin:120px 230px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
.pet .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pet #head{transform-origin:120px 150px;transition:transform .5s}
.m-happy.pet #catBody{animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-14px)}80%{transform:translateY(0) scale(1.04,.95)}}
.m-hungry.pet #tail{animation-duration:2.2s}
.m-hungry.pet #head{transform:rotate(-6deg)}
.m-weak.pet #tail{animation:none;transform:rotate(32deg)}
.m-weak.pet #head{transform:translateY(14px) rotate(4deg)}
.m-rescue.pet #catBody{animation:shiver .25s linear infinite}
@keyframes shiver{50%{transform:translateX(1.5px)}}
.m-rescue.pet #tail{animation:none;transform:rotate(40deg)}
.m-rescue.pet #head{transform:translateY(22px) rotate(8deg)}
.pet.eat #head{animation:chomp .25s 4}
@keyframes chomp{50%{transform:translateY(8px) rotate(3deg)}}
.pet.purr #catBody{animation:purr .12s linear 10}
@keyframes purr{50%{transform:scale(1.015,.985)}}
.pet .face{display:none}
.m-happy.pet .f-happy,.m-hungry.pet .f-hungry,.m-weak.pet .f-weak,.m-rescue.pet .f-rescue{display:inline}
.pet .acc{opacity:0;transition:opacity .6s}
.lv2.pet .acc-scarf,.lv3.pet .acc-scarf,.lv3.pet .acc-crown{opacity:1}
.m-weak.pet #catGroup{filter:saturate(.45)}
.m-rescue.pet #catGroup{filter:saturate(.25) brightness(.92)}
.pet .blanket{opacity:0}
.m-rescue.pet .blanket{opacity:1}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 14px}
.week button{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 0 7px;text-align:center;font-size:12px;color:var(--muted);font-weight:700;position:relative}
.week button b{display:block;font-size:17px;color:var(--ink);font-weight:900}
.week button.on{background:var(--navy);border-color:var(--navy);color:#cfe0e6}
.week button.on b{color:#fff}
.week button.today:not(.on){border-color:var(--sage)}
.week .dots{display:flex;justify-content:center;gap:2px;height:6px;margin-top:3px}
.week .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.week .dots i.d{background:var(--sage)}
.week button.on .dots i{background:rgba(255,255,255,.3)}
.week button.on .dots i.d{background:var(--butter)}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-t h3{font-size:19px;color:var(--ink)}
.task{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px}
.task .row1{display:flex;gap:10px;align-items:flex-start}
.task .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.task .tt{font-weight:700;color:var(--ink);font-size:16px;line-height:1.4}
.task .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.task .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.task .acts .btn{flex:1}
.task .note{margin-top:10px;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13.5px}
.task.done{opacity:.8}
.thumbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px}
.empty .e{font-size:40px;margin-bottom:6px}

/* chat */
.thread{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.thread .av{width:42px;height:42px;border-radius:14px;background:var(--sage-soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.thread .tx{flex:1;min-width:0}
.thread .tx b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tx span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .new{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0}
.chat{display:flex;flex-direction:column;gap:8px;padding:6px 0 90px}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg img{display:block;max-width:220px;border-radius:10px;margin-bottom:6px;cursor:zoom-in}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.msg.you{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:4px}
.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:31}
.composer .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;max-height:110px;outline:none;font-size:15px}
.composer .pv{max-width:760px;margin:0 auto 8px;display:flex;gap:6px}
.composer .pv img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.iconbtn{width:44px;height:44px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.iconbtn.send{background:var(--navy);color:#fff}

/* scores */
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0;border-bottom:1.5px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .col i{width:100%;max-width:38px;border-radius:9px 9px 3px 3px;background:var(--sage)}
.chart .col b{font-size:12px;color:var(--ink)}
.chart-l{display:flex;gap:10px;padding:6px 4px 0}
.chart-l span{flex:1;text-align:center;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.exam{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;width:100%;text-align:left}
.exam .sc{font-family:'Jua';font-size:24px;color:var(--ink);min-width:62px;text-align:right}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:12px}
.qgrid div{border-radius:10px;padding:6px 0;text-align:center;font-size:12px;font-weight:700}
.qgrid .o{background:var(--sage-soft);color:var(--sage-d)}
.qgrid .x{background:var(--peach-soft);color:var(--red)}

/* ---------- STAFF ---------- */
.st{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#FBEAF0;color:var(--ink);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side img{height:34px;width:auto;align-self:flex-start;margin:0 8px 6px;background:#fff;box-shadow:0 2px 8px rgba(200,120,150,.15);border-radius:12px;padding:7px 10px}
.side .me{margin:14px 8px 18px;font-size:13px;color:var(--muted)}
.side .me b{display:block;color:var(--ink);font-size:16px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px;border-radius:13px;color:#8A6A76;font-weight:700;font-size:15px;position:relative;margin-bottom:2px}

const KEY='forward-app-v1', SKEY='forward-session', EVKEY='forward-events';
const DAY=864e5, WD=['일','월','화','수','목','금','토'];

const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return dstr(d)};
const TODAY=dstr(new Date());
const wkStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)};
const wkDays=ws=>[0,1,2,3,4,5,6].map(i=>addD(ws,i));
const lbl=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/DAY);
const nowStr=()=>{const d=new Date();return dstr(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- 서버 (Supabase) ---------- */
const SB_URL='https://ltvejlubynybtladghkm.supabase.co', SB_KEY='sb_publishable_3trcVQfRXg5HONzqdS2jkg_KyWlV73k';
const ONLINE=!!SB_URL;
const SEP='\u0001';
let SNAP={}, SINCE=null, TOKEN=null, FOLDER='', pushT=null, syncBusy=Promise.resolve(), pendingRender=false, netErr=false;
async function rpc(fn,args){
  let r;try{r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){const er=new Error('인터넷 연결을 확인해 주세요');er.net=1;throw er}
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=(j&&j.message)||('서버 오류 '+r.status);const er=new Error(m==='auth'?'다시 로그인해 주세요':m);er.auth=m==='auth';throw er}
  return j;
}
function emptyDB(){return {v:3,T:[],C:[],S:[],tasks:[],E:[],R:[],Q:[],N:[],W:[],PR:[],L:[],PC:[],V:[],A:[],I:[],M:[],K:[],X:[],AT:[],SD:[],WB:[],P:{},TPL:['단어 시험 (다음 과)','단어 5번씩 쓰기','본문 분석 복습','문법 워크북 풀기','내신 기출 풀기','모의고사 1회 풀기','오답노트 정리','F:ORM 숙제','F:LOW 워크북'],evDone:0}}
const COLS=['T','C','S','tasks','E','R','Q','N','W','PR','L','PC','V','A','I','M','K','X','AT','SD'];
function toRows(db){const m={};COLS.forEach(c=>(db[c]||[]).forEach(o=>{if(o&&o.id)m[c+SEP+o.id]=o}));Object.keys(db.P||{}).forEach(k=>m['P'+SEP+k]=db.P[k]);m['meta'+SEP+'TPL']={id:'TPL',list:db.TPL||[]};(db.WB||[]).forEach(o=>{if(o&&o.id)m['meta'+SEP+o.id]=o});return m}
function fromRows(m){const db=emptyDB();let tpl=null;for(const k in m){const [c,id]=k.split(SEP),d=m[k];if(c==='P')db.P[id]=d;else if(c==='meta'){if(id==='TPL')tpl=d.list;else if(id.startsWith('WB_'))db.WB.push(d)}else if(db[c])db[c].push(d)}if(tpl)db.TPL=tpl;return db}
function applyRows(rows){
  if(!rows||!rows.length)return false;
  const m=toRows(DB);
  rows.forEach(r=>{const k=r.col+SEP+r.id;if(r.data==null){delete m[k];delete SNAP[k]}else{m[k]=r.data;SNAP[k]=JSON.stringify(r.data)}});
  DB=fromRows(m);return true;
}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function upPhoto(du){
  const b=await (await fetch(du)).blob();
  const name=FOLDER+'/'+Date.now().toString(36)+uid()+(b.type==='image/png'?'.png':'.jpg');
  const r=await fetch(SB_URL+'/storage/v1/object/hw/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':b.type||'image/jpeg'},body:b});
  if(!r.ok)throw new Error('사진 올리기 실패');

}
async function upAll(o){ // 객체 안의 사진(data:)을 서버 사진으로 바꾸기

function syncDot(state){const e=document.getElementById('sync');if(!e)return;e.className='sync '+state;e.textContent=state==='busy'?'저장 중…':state==='err'?'⚠️ 저장 안 됨 · 다시 시도 중':'✓ 저장됨'}
function queue(fn){syncBusy=syncBusy.then(fn,fn);return syncBusy}
function pushNow(){return queue(async()=>{
  if(!TOKEN)return;
  const m=toRows(DB),rows=[];
  for(const k in m){const js=JSON.stringify(m[k]);if(SNAP[k]!==js)rows.push(k)}
  const dels=Object.keys(SNAP).filter(k=>!(k in m));
  if(!rows.length&&!dels.length){syncDot('ok');return}
  syncDot('busy');
  try{
    for(const k of rows){if(JSON.stringify(m[k]).includes('"data:image/'))await upAll(m[k])}
    const payload=rows.map(k=>{const [col,id]=k.split(SEP);return {col,id,data:m[k]}}).concat(dels.map(k=>{const [col,id]=k.split(SEP);return {col,id,data:null}}));
    for(let i=0;i<payload.length;i+=200)await rpc('fw_push',{p_token:TOKEN,p_rows:payload.slice(i,i+200)});
    rows.forEach(k=>SNAP[k]=JSON.stringify(m[k]));dels.forEach(k=>delete SNAP[k]);
    netErr=false;syncDot('ok');
  }catch(e){
    if(e.auth){return forceLogout()}
    netErr=true;syncDot('err');clearTimeout(pushT);pushT=setTimeout(pushNow,8000);
  }
})}
function pullNow(full){return queue(async()=>{
  if(!TOKEN)return false;
  try{
    const j=await rpc('fw_pull',{p_token:TOKEN,p_since:full?null:SINCE});
    if(full){DB=emptyDB();SNAP={}}
    const ch=applyRows(j.rows);
    SINCE=new Date(new Date(j.now).getTime()-5000).toISOString();
    return ch||full;
  }catch(e){if(e.auth)forceLogout();return false}
})}

function risk(sid){
  const why=[], d=petDays(sid);
  if(d>=3)why.push(d+'일째 미제출');
  const over=DB.tasks.filter(t=>t.sid===sid&&t.date<TODAY&&(t.status==='todo'||t.status==='redo')).length;
  if(over>=3)why.push('밀린 숙제 '+over+'개');
  const ts=DB.tasks.filter(t=>t.sid===sid&&t.date<=TODAY&&t.date>=addD(TODAY,-13));
  if(ts.length>=3){const r=Math.round(ts.filter(t=>t.status==='ok'||t.status==='sub').length/ts.length*100);if(r<60)why.push('2주 제출률 '+r+'%')}
  const ex=DB.E.filter(e=>e.res[sid]).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(ex){const p=examScore(ex,sid).pct;if(p<60)why.push('최근 시험 '+p+'점')}
  const redo=ts.filter(t=>t.status==='redo').length;if(redo>=2)why.push('다시 제출 '+redo+'회');
  if(ME&&ME.role!=='student'&&pcLate(sid))why.push('학부모 연락 '+pcDays(sid)+'일째 없음');
  return {why,lv:why.length>=2?'danger':why.length?'warn':''};
}

function hm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function hmMin(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function atMins(a,now){return (a&&a.v||[]).reduce((s,v)=>s+Math.max(0,(v.out?hmMin(v.out):(now?hmMin(hm()):hmMin(v.in)))-hmMin(v.in)),0)}
function atIn(a){const v=a&&a.v||[];return v.length&&!v[v.length-1].out}
function fmtMin(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)}시간${m%60?' '+m%60+'분':''}`:`${m}분`}
function atToggle(sid,who){const date=TODAY;let a=atGet(sid,date);if(!a){a={id:sid+'_'+date,sid,date,v:[]};atRows().push(a)}

  return {kind,t,name:s.name,a}}

/* ----- ⏱️ 공부 타이머 (SD) ----- */
const SDSUBJ=['단어','숙제','독해','문법','내신 대비','모의고사','기타'];
const SDMAX=240;
function sdRows(){return DB.SD||(DB.SD=[])}
function sdOf(sid){return sdRows().filter(r=>r.sid===sid&&!r.del)}
function sdLive(sid){return sdOf(sid).find(r=>!r.end)}
function sdEl(r){return Math.max(0,(r.pz||Date.now())-r.start-(r.pms||0))}
function sdM(r){return r.end?(r.mins||0):Math.min(SDMAX,sdEl(r)/60000)}
function sdA(r,extra){return r.pz?'':`data-sdstart="${r.start+(r.pms||0)}"${extra||''}`}
function sdPause(){const r=sdLive(ME.id);if(!r||r.pz)return;r.pz=Date.now();r.np=(r.np||0)+1;save();render();toast('☕ 잠깐 쉬는 중! 쉬는 시간은 빼고 기록돼요')}
function sdResume(){const r=sdLive(ME.id);if(!r||!r.pz)return;r.pms=(r.pms||0)+(Date.now()-r.pz);r.pz=null;save();render();toast('▶ 이어서 공부! 화이팅 💪')}
function sdStreak(sid){let n=0,d=TODAY;if(!sdDay(sid,d))d=addD(d,-1);while(sdDay(sid,d)>=1){n++;d=addD(d,-1)}return n}
function sdDay(sid,d){return sdOf(sid).filter(r=>r.date===d).reduce((a,r)=>a+sdM(r),0)}
function sdWeek(sid,ws){const ds=wkDays(ws);return sdOf(sid).filter(r=>ds.includes(r.date)).reduce((a,r)=>a+sdM(r),0)}
function sdClock(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':')}
function sdTick(){clearInterval(UI.sdT);UI.sdT=setInterval(()=>{const els=document.querySelectorAll('[data-sdstart]');if(!els.length&&!document.querySelector('[data-pzstart]')){clearInterval(UI.sdT);return}document.querySelectorAll('[data-pzstart]').forEach(e=>e.textContent=sdClock(Date.now()-(+e.dataset.pzstart)).slice(3));els.forEach(e=>{const st=+e.dataset.sdstart;e.textContent=e.dataset.fmt==='min'?fmtMin(Math.min(SDMAX,(Date.now()-st)/60000)+(+e.dataset.base||0)):sdClock(Math.min(SDMAX*60000,Date.now()-st))})},1000)}
function sdStart(){const s=stu(ME.id);if(sdLive(s.id))return;sdRows().push({id:'sd'+uid(),sid:s.id,date:TODAY,subj:'공부',start:Date.now(),end:null});save();render();toast('⏱️ 공부 시작! 화이팅 💪')}
function sdStop(){const r=sdLive(ME.id);if(!r)return;if(r.pz){r.pms=(r.pms||0)+(Date.now()-r.pz);r.pz=null}r.end=Date.now();const m=Math.round(sdEl(r)/60000);if(m<1){r.del=true;save();render();toast('1분이 안 돼서 기록하지 않았어요');return}r.mins=Math.min(SDMAX,m);save();render();toast(m>SDMAX?`한 번에 최대 4시간까지만 기록돼요 (${fmtMin(SDMAX)})`:`👏 ${fmtMin(r.mins)} 공부 기록했어요!`)}
function sdDel(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='지울까요?';return}const r=sdRows().find(x=>x.id===id);if(r){r.del=true;save();render()}}
function sdBars(sid){const days=[...Array(7)].map((_,i)=>addD(TODAY,i-6)),v=days.map(d=>sdDay(sid,d)),mx=Math.max(60,...v);

/* ----- ⚔️ 1:1 도전장 테스트 ----- */
const XTYPES=['어휘','어법','구문·해석','빈칸','순서·삽입','주제·요지','서술형·영작','본문 암기','기타'];
function xNowMs(){return Date.now()}
function xMs(str){if(!str)return 0;const [d,t]=str.split(' ');const [y,m,dd]=d.split('-').map(Number),[h,mi]=(t||'00:00').split(':').map(Number);return new Date(y,m-1,dd,h,mi).getTime()}
function xFmt(str){if(!str)return '';const ms=xMs(str);return lbl(str.slice(0,10))+' '+str.slice(11,16)}
function xLeft(ms){const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${String(ss).padStart(2,'0')}초`:`${ss}초`}
function xExpired(x){return x.status==='sent'&&x.due&&xNowMs()>xMs(x.due)&&!(x.start&&x.lim&&xNowMs()<(x.startMs||xMs(x.start))+x.lim*60000)}
function xEnd(x){const a=x.due?xMs(x.due):Infinity,b=(x.start&&x.lim)?(x.startMs||xMs(x.start))+x.lim*60000:Infinity;return Math.min(a,b)}
function xRows(){return DB.X||(DB.X=[])}
function xGet(id){return xRows().find(x=>x.id===id)}
function xScore(x){const it=(x.items||[]).filter(i=>i.ok===true||i.ok===false);const r=it.filter(i=>i.ok).length;return {r,n:(x.items||[]).length,g:it.length,p:it.length?Math.round(r/it.length*100):0}}
function xStatusChip(x){if(xExpired(x))return '<span class="chip c-redo">⏰ 기한 지남</span>';return {req:'<span class="chip c-sub">📮 도전 신청</span>',sent:'<span class="chip c-todo">⚔️ 도전 중</span>',done:'<span class="chip c-redo">✍️ 채점 대기</span>',graded:`<span class="chip c-ok">✅ ${xScore(x).p}점</span>`,no:'<span class="chip">다음 기회에</span>'}[x.status]||''}
/* --- 학생 --- */
function sXBanner(s){const L=xRows().filter(x=>x.sid===s.id&&x.status==='sent'&&!xExpired(x));if(!L.length)return '';
  return L.map(x=>`<div class="xchal" onclick="UI.st='score';UI.xt='${x.id}';render();scrollTo(0,0)"><div class="xc-i">⚔️</div><div style="flex:1"><b>${esc(tLabel(tch(x.tid)||{name:'선생님'}))}의 도전장 도착!</b><small>${esc(x.title)} · ${(x.items||[]).length}문제${x.due?` · ⏰ ${esc(xFmt(x.due))}까지`:''}${x.lim?` · 풀이 ${x.lim}분`:''} · 거절 불가 😼</small></div><span class="btn btn-navy btn-sm">도전하기</span></div>`).join('')}
function sXList(s){const L=xRows().filter(x=>x.sid===s.id).sort((a,b)=>(a.at||'')<(b.at||'')?1:-1);
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="color:var(--ink);font-size:16px">⚔️ 1:1 도전장</b><button class="btn btn-navy btn-sm" onclick="xReq()">📮 선생님께 도전 신청</button></div>
  ${L.length?L.slice(0,12).map(x=>`<div class="list-row" style="cursor:pointer" onclick="UI.xt='${x.id}';render();scrollTo(0,0)"><div style="flex:1;min-width:0"><b style="color:var(--ink);font-size:14px">${esc(x.title||'도전 신청')}</b><div class="muted" style="font-size:12px">${esc(tLabel(tch(x.tid)||{name:''}))} · ${esc((x.at||'').slice(5,10).replace('-','/'))}</div></div>${xStatusChip(x)}</div>`).join(''):'<p class="muted" style="font-size:13px;margin:8px 0 0">자신 있는 범위가 있으면 선생님께 먼저 도전해 보세요! 💪</p>'}
  ${xRows().some(x=>x.sid===s.id&&x.status==='graded')?`<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="xReport('${s.id}')">📊 나의 유형별 리포트</button>`:''}</div>`}
function xReq(){const s=stu(ME.id);modal(`<h3 class="jua">📮 선생님께 도전 신청</h3><p class="muted" style="font-size:13px">수업 전이나 학원에 못 올 때 1:1 테스트를 받을 수 있어요. 선생님이 받아주면 문제가 도착해요!</p>
  <label class="lb">어떤 걸로 도전할까요?</label><textarea class="inp" id="xr-m" rows="3" placeholder="예) 올림포스 3강 본문 어법 자신 있어요! / 이번 주 단어 30개"></textarea>
  <label class="lb">언제쯤 볼 수 있어요? <span class="muted" style="font-weight:400">(선택)</span></label><input class="inp" id="xr-w" placeholder="예) 오늘 밤 9시 / 목요일 수업 전">
  <div class="btns"><button class="btn btn-ghost" onclick="tryCloseModal()">취소</button><button class="btn btn-navy" onclick="xReqSend()">⚔️ 도전 신청</button></div>`)}
function xReqSend(){const m=$('#xr-m').value.trim();if(!m){toast('어떤 걸로 도전할지 적어주세요');return}const s=stu(ME.id),tid=sTid(s)||ownerId();
  xRows().push({id:'x'+uid(),sid:s.id,tid,from:'s',status:'req',req:m,when:$('#xr-w').value.trim(),title:'',items:[],at:nowStr()});save();
  notify([tid,ownerId()],'📮 '+s.name+' 학생 도전 신청!',m.slice(0,60));closeModal();render();toast('도전 신청을 보냈어요! 선생님이 받아주면 알려줄게요 ⚔️')}
function sXView(x){const done=x.status==='done'||x.status==='graded',g=x.status==='graded',sc=xScore(x);
  if(x.status==='sent'&&xExpired(x))return `<button class="backlink" onclick="UI.xt=null;render()">← 성적으로</button><div class="card" style="text-align:center;padding:26px"><div style="font-size:40px">⏰</div><b style="font-size:17px">유효 시간이 지났어요</b><p class="muted">${esc(x.title)} · ${esc(xFmt(x.due))}까지였어요.<br>선생님께 쪽지로 말씀드려 보세요.</p></div>`;
  if(x.status==='sent'&&x.lim&&!x.start)return `<button class="backlink" onclick="UI.xt=null;render()">← 성적으로</button><div class="card" style="text-align:center;padding:26px"><div style="font-size:44px">⚔️</div><h2 class="jua" style="margin:6px 0">${esc(x.title)}</h2><p style="font-size:15px;line-height:1.8">${(x.items||[]).length}문제 · <b>풀이 시간 ${x.lim}분</b>${x.due?`<br>⏰ ${esc(xFmt(x.due))}까지 제출`:''}</p><p class="muted" style="font-size:13px">시작하면 타이머가 돌아가고, 시간이 끝나면 적은 답으로 자동 제출돼요.</p><button class="btn btn-navy" style="font-size:17px;padding:14px 30px;margin-top:6px" onclick="xStart('${x.id}')">▶ 도전 시작</button></div>`;
  if(x.status==='sent')setTimeout(()=>xTimerArm(x.id),0);
  if(x.status==='req'||x.status==='no')return `<button class="backlink" onclick="UI.xt=null;render()">← 성적으로</button><div class="card"><b style="font-size:16px">📮 도전 신청</b><p style="white-space:pre-wrap">${esc(x.req||'')}</p>${x.status==='no'?`<p class="muted">선생님 답: ${esc(x.reply||'다음에 도전해요!')}</p>`:'<p class="muted">선생님이 확인하면 문제가 도착해요 ⏳</p>'}</div>`;
  return `<button class="backlink" onclick="UI.xt=null;render()">← 성적으로</button>
  <div class="xhead"><div class="xc-i">⚔️</div><div><h2 class="jua" style="margin:0">${esc(x.title)}</h2><p class="muted" style="margin:2px 0 0;font-size:13px">${esc(tLabel(tch(x.tid)||{name:''}))}의 1:1 도전장 · ${(x.items||[]).length}문제</p></div>${g?`<div class="xbig ${sc.p>=80?'win':''}">${sc.p}<small>점</small></div>`:''}</div>
  ${g&&x.cm?`<div class="card" style="background:var(--navy-soft)"><b>💬 선생님 한마디</b><div style="white-space:pre-wrap;margin-top:4px">${esc(x.cm)}</div></div>`:''}
  ${x.mode==='file'?xFileView(x,done?'done':'answer')+(done?'':`<div class="card"><b style="color:var(--ink)">✏️ 답 모아 보기</b><p class="muted" style="font-size:12.5px;margin:2px 0 8px">시험지 칸에 바로 써도 되고, 여기에 써도 똑같이 들어가요</p>${x.items.map((it,k)=>it.kind==='mc'?`<div class="xl"><b>${k+1}</b>${[1,2,3,4,5].slice(0,it.opts.length).map(v=>`<button class="xcbtn ${+it.ans===v?'on':''}" onclick="xPickMC('${x.id}',${k},${v})">${'①②③④⑤'[v-1]}</button>`).join('')}</div>`:`<div class="xl"><b>${k+1}</b><input class="inp" id="xl-${k}" value="${esc(it.ans||'')}" oninput="xGet('${x.id}').items[${k}].ans=this.value;UI.xdirty=1;const o=document.querySelector('.xin[data-k="${k}"]');if(o)o.value=this.value"></div>`).join('')}</div>`)+(g?`<div class="card">${x.items.map((it,k)=>`<div class="xl"><b>${k+1}</b><span style="flex:1">${esc(xAnsTxt(it))}</span>${it.ok?'⭕':'❌'}${it.note?`<small class="xq-n" style="flex-basis:100%">✏️ ${esc(it.note)}</small>`:''}</div>`).join('')}</div>`:''):''}
  ${x.mode==='file'?'':(x.items||[]).map((it,k)=>`<div class="card xq"><div class="xq-h"><b>${k+1}번</b>${g?(it.ok?'<span class="xo">⭕</span>':'<span class="xx">❌</span>'):''}</div>
    <div class="xq-q">${esc(it.q||'')}</div>${it.img?`<img data-v src="${it.img}" class="xq-img">`:''}
    ${done?`<div class="xq-a"><small>내 답</small>${esc(it.ans||'(빈칸)')}${it.aimg?`<img data-v src="${it.aimg}" class="xq-img">`:''}</div>${g&&it.note?`<div class="xq-n">✏️ ${esc(it.note)}</div>`:''}`
      :`<textarea class="inp" rows="2" placeholder="답을 적어요" oninput="xGet('${x.id}').items[${k}].ans=this.value;UI.xdirty=1">${esc(it.ans||'')}</textarea><button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="pickFiles(m=>{xGet('${x.id}').items[${k}].aimg=m[0];render()})">📷 손글씨 사진${it.aimg?' ✓':''}</button>`}</div>`).join('')}
  ${done?(g?'':'<div class="empty">제출 완료! 선생님이 채점하면 알려줄게요 ⏳</div>'):`${xEnd(x)<Infinity?'<div class="xtimer" id="xtimer"></div>':''}<button class="btn btn-navy" style="width:100%;padding:15px;font-size:17px" onclick="xSubmit('${x.id}')">⚔️ 제출하기</button><p class="muted" style="font-size:12px;text-align:center">도전장은 거절할 수 없어요 😼 다 풀고 제출해 주세요</p>`}`}
function xAnsTxt(it){return it.kind==='mc'?(it.ans?'①②③④⑤'[it.ans-1]:'(안 고름)'):(it.ans||'(빈칸)')}
function xPickMC(id,k,v){const it=xGet(id).items[k];it.ans=+it.ans===v?'':v;UI.xdirty=1;render()}
function xStart(id){const x=xGet(id);x.start=nowStr();x.startMs=Date.now();save();render();scrollTo(0,0)}
const XTM={t:null,id:null};
function xTimerArm(id){XTM.id=id;if(!XTM.t)XTM.t=setInterval(xTimerTick,1000);xTimerTick()}
function xTimerTick(){const x=xGet(XTM.id);if(!x||x.status!=='sent'||UI.xt!==x.id){clearInterval(XTM.t);XTM.t=null;return}
  const left=xEnd(x)-xNowMs(),el=$('#xtimer');if(el)el.innerHTML=`⏱️ 남은 시간 <b>${xLeft(left)}</b>`;if(el)el.classList.toggle('hurry',left<60000);
  if(left<=0){clearInterval(XTM.t);XTM.t=null;UI.xsc=1;xSubmit(x.id,true)}}
function xAutoMC(x){x.items.forEach(it=>{if(it.kind==='mc'&&(it.key===0||it.key))it.ok=+it.ans===it.key+1})}
function xSubmit(id,auto){const x=xGet(id);xAutoMC(x);if(auto){x.status='done';x.sub=nowStr();x.auto=1;save();notify([x.tid],'⚔️ '+stu(x.sid).name+' 도전장 제출(시간 종료)',x.title);render();toast('⏰ 시간이 끝나서 적은 답으로 제출했어요');return}
  if(xExpired(x)){toast('유효 시간이 지났어요');render();return}const empty=x.items.filter(i=>!String(i.ans||'').trim()&&!i.aimg).length;
  if(empty&&!UI.xsc){UI.xsc=1;toast(`빈 답이 ${empty}개 있어요. 그래도 내려면 한 번 더 눌러주세요`);setTimeout(()=>UI.xsc=0,3000);return}
  x.status='done';x.sub=nowStr();UI.xdirty=0;save();notify([x.tid],'⚔️ '+stu(x.sid).name+' 도전장 제출',x.title);render();scrollTo(0,0);toast('제출했어요! 결과는 알림으로 알려줄게요 ⚔️')}

function xDuePreset(k){const d=new Date();if(k==='1h')d.setHours(d.getHours()+1);else if(k==='3h')d.setHours(d.getHours()+3);else if(k==='today')d.setHours(23,59,0,0);else if(k==='tom')(d.setDate(d.getDate()+1),d.setHours(23,59,0,0));else if(k==='3d')(d.setDate(d.getDate()+3),d.setHours(23,59,0,0));else return '';return dstr(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;

  try{
    const p=await Notification.requestPermission();if(p!=='granted'){toast('알림이 꺼져 있어요. 휴대폰 설정에서 포워드 알림을 허용해 주세요');return}

  }catch(e){toast('알림을 켜지 못했어요: '+(e.message||e))}
}

function ssList(){const L=DB.S.slice().sort((a,b)=>a.name<b.name?-1:1).filter(s=>!UI.ss.q||s.name.includes(UI.ss.q));
  const box=$('#ss-list');if(!box)return;box.innerHTML=L.map(s=>`<button class="s ${UI.ss.sids.includes(s.id)?'on':''}" onclick="const i=UI.ss.sids.indexOf('${s.id}');if(i>=0)UI.ss.sids.splice(i,1);else UI.ss.sids.push('${s.id}');ssList()">${UI.ss.sids.includes(s.id)?'✓ ':''}${esc(s.name)} <span style="opacity:.6;font-weight:400">${esc(s.grade||'')}</span></button>`).join('')||'<span class="muted" style="font-size:13px">등록된 학생이 없어요. 학생 관리에서 먼저 등록해 주세요.</span>';

function saveSess(id){
  const name=$('#ss-n').value.trim(),day=+$('#ss-d').value,start=$('#ss-s').value,end=$('#ss-e').value,room=$('#ss-r').value;
  if(!name){toast('반 이름을 적어주세요');return}
  if(toMin(end)<=toMin(start)){toast('끝나는 시간이 시작보다 늦어야 해요');return}
  if(toMin(start)<openFrom(day)){toast((day===0||day===6)?'주말은 11시부터예요':'평일은 14시부터예요');return}
  const cur=id?DB.C.find(x=>x.id===id):null, ws=UI.ttw||wkStart(TODAY);
  const oneOff=(cur&&cur.week)||(!id&&UI.ss.kind==='extra');
  const pool=oneOff?weekSess(cur&&cur.week||ws).filter(x=>!x._off):sessions();
  const clash=pool.find(x=>x.id!==id&&x.id!==(cur&&cur.of)&&x.day===day&&x.room===room&&toMin(x.start)<toMin(end)&&toMin(start)<toMin(x.end));
  if(clash){toast(`${ROOMS.find(r=>r[0]===room)[1]} 강의실에 이미 「${clash.name}」 수업이 있어요 (${clash.start}~${clash.end})`);return}
  const o={name,tid:$('#ss-t').value,day,start,end,room,sids:UI.ss.sids.slice()};
  const m=$('#ss-m');if(m)o.memo=m.value.trim();
  if(id)Object.assign(cur,o);else if(UI.ss.kind==='extra')DB.C.push(Object.assign({id:'c'+uid(),kind:'extra',week:ws},o));else DB.C.push(Object.assign({id:'c'+uid()},o));

}

function tPlan(){
  UI.pw=UI.pw||wkStart(TODAY);
  const members=myStudents().sort((a,b)=>a.name<b.name?-1:1);
  if(!members.length) return `<button class="backlink" onclick="UI.pmode=null;render()">← 학생 목록으로</button><div class="empty">학생이 없어요. 학생 관리에서 먼저 등록해 주세요.</div>`;
  if(UI.psFor!=='multi'){UI.ps=[];UI.psFor='multi'}
  UI.ps=UI.ps.filter(id=>members.some(s=>s.id===id));
  const sel=UI.ps, days=wkDays(UI.pw); UI.pg=[];
  const cols=days.map(d=>{
    const items=DB.tasks.filter(t=>t.date===d&&sel.includes(t.sid));
    const groups={};items.forEach(t=>{const k=t.title+'\u0001'+t.kind;(groups[k]=groups[k]||[]).push(t)});
    const isC=false;
    return `<div class="day ${isC?'cls':''} ${d<TODAY?'past':''} ${d===TODAY?'todayc':''}"><h4><span>${WD[pd(d).getDay()]} ${pd(d).getDate()}</span>${isC?'<small>수업</small>':''}</h4>
      ${Object.entries(groups).map(([k,ts])=>{const [title,kind]=k.split('\u0001'),dn=ts.filter(t=>t.status==='ok'||t.status==='sub').length;UI.pg.push({d,title,kind});return `<div class="pitem ${kind}"><b>${kind==='voca'?'✏️ ':''}${esc(title)}</b><span>${dn}/${ts.length}명 제출</span><button class="x" title="삭제" onclick="delGroup(${UI.pg.length-1})">✕</button></div>`}).join('')}
      <button class="addbtn" onclick="addPlan('${d}')">+ 숙제</button></div>`;
  }).join('');
  return `<button class="backlink" onclick="UI.pmode=null;render()">← 학생 목록으로</button><div class="ph"><div><h2 class="jua">여러 명에게 같은 숙제</h2><p>학생을 고르고, 날짜 칸의 <b>+ 숙제</b>를 누르면 고른 학생 모두에게 한 번에 들어가요</p></div>
    <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="copyWeek()">📋 지난주 숙제 그대로 복사</button></div></div>
  <div class="planbar"><div class="wk-nav"><button onclick="UI.pw=addD(UI.pw,-7);render()">‹</button><span>${lbl(days[0])} ~ ${lbl(days[6])}</span><button onclick="UI.pw=addD(UI.pw,7);render()">›</button></div>
    <button class="btn btn-ghost btn-sm" onclick="UI.pw=wkStart(TODAY);render()">이번 주</button>
    <span class="muted" style="font-size:13px;margin-left:4px">고른 학생 ${sel.length}명</span></div>
  ${filterBar('multi')}<div id="spwrap" style="margin-bottom:12px">${multiList()}</div>
  ${sel.length?`<div class="selbar">✓ 고른 학생 ${sel.length}명: ${sel.map(id=>esc((stu(id)||{}).name||'')).join(', ')}</div>`:''}
  ${sel.length?'':'<div class="empty" style="padding:14px">위에서 숙제를 받을 학생을 먼저 골라주세요</div>'}
  <div class="board">${cols}</div>`;

const PCHOW=['📞 통화','💬 카톡','✉️ 문자','🤝 대면'];
function lastPC(sid){return DB.PC.filter(p=>p.sid===sid).sort((a,b)=>a.date<b.date?1:-1)[0]}
/* 일지·학부모 연락 경고는 이 날짜부터 집계 (첫 주는 적응 기간) */
const CARE_START='2026-11-23';
function pcDays(sid){const s=stu(sid),p=lastPC(sid);let base=CARE_START;if(p&&p.date>base)base=p.date;if(s&&s.reg&&s.reg>base)base=s.reg;return Math.max(0,diffD(base,TODAY))}
const pcLate=sid=>pcDays(sid)>=14;
function pcBadge(sid){const p=lastPC(sid),d=pcDays(sid);if(pcLate(sid))return `<span class="chip c-redo">📞 ${p?d+'일째 연락 없음':'2주째 연락 기록 없음'}</span>`;return p?`<span class="chip c-ok">📞 ${diffD(p.date,TODAY)===0?'오늘':diffD(p.date,TODAY)+'일 전'} 연락</span>`:`<span class="chip c-todo">📞 연락 기록 전</span>`}
function autoLog(sid,date){
  const vr=DB.R.filter(r=>r.sid===sid&&r.voca&&r.date===date).map(r=>r.title.replace('단어 · ','')+' '+r.value);
  const ex=DB.E.filter(e=>e.date===date&&e.res&&e.res[sid]).map(e=>e.title+' '+examScore(e,sid).pct+'점');
  const nc=(()=>{const ds=sDays(stu(sid));for(let i=1;i<=7;i++){const d=addD(date,i);if(ds.includes(pd(d).getDay()))return d}return addD(date,7)})();
  const hw=DB.tasks.filter(t=>t.sid===sid&&t.date>date&&t.date<=nc).sort((a,b)=>a.date<b.date?-1:1).map(t=>lbl(t.date)+' '+t.title);
  return {voca:vr.join(', '),exam:ex.join(', '),hw:hw.join('\n')};
}
function logMsg(L){

  const tests=line('단어',L.voca)+line('구문',L.syntax)+line('내신',L.exam);
  if(L.att==='결석')return `[포워드 영어학원] ${s.name} 학생 결석 안내 (${lbl(L.date)})\n\n오늘 수업에 결석했어요.\n`+(L.content&&L.content.trim()?`\n📖 오늘 진행한 수업\n${L.content.trim().split('\n').map(x=>'- '+x.replace(/^[-·•]\s*/,'')).join('\n')}\n`:'')+`\n📺 수업 영상은 포워드 학습관리 앱 '오늘' 화면에 올려드릴게요.\n`+(L.hw&&L.hw.trim()?`\n📝 숙제\n${L.hw.trim().split('\n').map(x=>'- '+x.replace(/^[-·•]\s*/,'')).join('\n')}\n`:'')+(L.memo&&L.memo.trim()?`\n💬 ${L.memo.trim()}\n`:'')+`\n담당: ${t.name}${t.role==='owner'?' 원장':' 선생님'}\n문의: 053-716-0859`;
  return `[포워드 영어학원] ${s.name} 학생 수업 안내 (${lbl(L.date)})${L.att==='지각'?' · 지각':''}\n\n`+
   (L.content&&L.content.trim()?`📖 오늘 수업\n${L.content.trim().split('\n').map(x=>'- '+x.replace(/^[-·•]\s*/,'')).join('\n')}\n\n`:'')+
   (tests?`✅ 테스트 결과\n${tests}\n`:'')+
   (L.hw&&L.hw.trim()?`📝 다음 수업까지 숙제\n${L.hw.trim().split('\n').map(x=>'- '+x.replace(/^[-·•]\s*/,'')).join('\n')}\n\n`:'')+
   (L.memo&&L.memo.trim()?`💬 선생님 한마디\n${L.memo.trim()}\n\n`:'')+
   `담당: ${t.name}${t.role==='owner'?' 원장':' 선생님'}\n문의: 053-716-0859`;
}

/* 수업 발생 목록 (최근 7일) */
function occurrences(from,to){
  const out=[];const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  for(let d=from;d<=to;d=addD(d,1)){
    const ws=wkStart(d),wd=pd(d).getDay();
    weekSess(ws).filter(c=>!c._off&&c.day===wd).forEach(c=>{if(d===TODAY&&toMin(c.end)>nowM)return;(c.sids||[]).forEach(sid=>{if(stu(sid))out.push({sid,date:d,tid:c.tid,cname:c.name,time:c.start})})});
    DB.S.forEach(s=>{if(sessOf(s.id).length||d===TODAY)return;const days=Array.isArray(s.days)?s.days:(cls(s.cid)&&!isSess(cls(s.cid))?cls(s.cid).days||[]:[]);if(days.includes(wd)&&!out.some(o=>o.sid===s.id&&o.date===d))out.push({sid:s.id,date:d,tid:sTid(s),cname:'',time:''})});
  }
  return out;
}
function hasLog(sid,date){return DB.L.some(l=>l.sid===sid&&l.date===date)}
function hasHW(sid,date){return DB.tasks.some(t=>t.sid===sid&&(t.made===date||(t.date>date&&t.date<=addD(date,7)&&(!t.made||t.made>=date))))}
const careFrom=()=>{const f=addD(TODAY,-6);return f<CARE_START?CARE_START:f};
function missingFor(sid){return TODAY<CARE_START?[]:occurrences(careFrom(),TODAY).filter(o=>o.sid===sid&&!hasLog(sid,o.date))}

function ocrKey(f){
  if(!f)return;const st=$('#ocrst');st.textContent='답지를 읽는 중이에요… (처음엔 10~20초 걸려요)';
  const go=()=>{const r=new FileReader();r.onload=async()=>{try{
      const w=await Tesseract.createWorker('eng');const {data}=await w.recognize(r.result);await w.terminate();
      const txt=data.text.replace(/[①❶⑴]/g,'1').replace(/[②❷⑵]/g,'2').replace(/[③❸⑶]/g,'3').replace(/[④❹⑷]/g,'4').replace(/[⑤❺⑸]/g,'5');
      const found={};let m;const re=/(\d{1,2})\s*[\.\)\]:번\-]?\s*[\(\[]?([1-5])(?!\d)/g;
      while((m=re.exec(txt))){const q=+m[1];if(q>=1&&q<=60&&!found[q])found[q]=+m[2]}
      const ins=[...document.querySelectorAll('#exgrid .ko')];let n=0;
      ins.forEach((inp,i)=>{if(found[i+1]){inp.value=found[i+1];inp.classList.add('ocr');n++}});
      st.innerHTML=n?`✅ ${n}문항을 채웠어요. <b>노란 칸은 사진에서 읽은 값이니 꼭 한 번 확인해 주세요.</b>`:'😢 번호와 정답을 찾지 못했어요. 답지를 밝고 반듯하게 다시 찍거나 직접 입력해 주세요.';
    }catch(e){st.textContent='사진을 읽지 못했어요. 직접 입력해 주세요.'}};r.readAsDataURL(f)};
  if(window.Tesseract)go();else{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=go;sc.onerror=()=>{st.textContent='글자 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'};document.head.appendChild(sc)}
}

/* 성적 추이 그래프 */
function numScore(v){const m=String(v).match(/^\s*(\d+(?:\.\d+)?)\s*(?:점)?\s*(?:\/\s*(\d+))?\s*$/);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:100;if(!b||a>b)return null;return Math.round(a/b*100)}
function scoreSeries(sid){
  const ex=DB.E.filter(e=>e.res&&e.res[sid]).map(e=>({d:e.date,t:e.title,p:examScore(e,sid).pct}));
  const vr=DB.R.filter(r=>r.sid===sid&&r.voca).map(r=>({d:r.date,t:r.title.replace('단어 · ',''),p:numScore(r.value)})).filter(x=>x.p!==null);
  const sc=DB.R.filter(r=>r.sid===sid&&!r.voca).map(r=>({d:r.date,t:r.title,p:numScore(r.value)})).filter(x=>x.p!==null);
  const srt=a=>a.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  return [{k:'학원 시험',c:'#D68FA5',pts:srt(ex).slice(-12)},{k:'단어 시험',c:'#8FB39A',pts:srt(vr).slice(-15)},{k:'학교·모의',c:'#E0B25A',pts:srt(sc).slice(-10)}].filter(x=>x.pts.length);
}
function trendChart(sid){
  const ser=scoreSeries(sid);if(!ser.some(x=>x.pts.length>1))return '';
  const ds=[...new Set(ser.flatMap(x=>x.pts.map(p=>p.d)))].sort(),W=640,H=210,L=34,R=12,T=14,B=28;
  const X=d=>ds.length<2?L+(W-L-R)/2:L+ds.indexOf(d)/(ds.length-1)*(W-L-R),Y=p=>T+(100-p)/100*(H-T-B);
  const grid=[0,50,80,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#F2E4E8" ${v===80?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="#A88E99">${v}</text>`).join('');
  const lab=[ds[0],ds[Math.floor(ds.length/2)],ds[ds.length-1]].filter((d,i,a)=>a.indexOf(d)===i).map(d=>`<text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#A88E99">${d.slice(5).replace('-','/')}</text>`).join('');
  const lines=ser.map(x=>`<polyline fill="none" stroke="${x.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${x.pts.map(p=>X(p.d)+','+Y(p.p)).join(' ')}"/>${x.pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.p)}" r="4" fill="#fff" stroke="${x.c}" stroke-width="2"><title>${esc(p.d)} · ${esc(p.t)} · ${p.p}점</title></circle>`).join('')}`).join('');
  const avg=a=>Math.round(a.reduce((s,p)=>s+p.p,0)/a.length);
  const leg=ser.map(x=>{const n=x.pts.length,last=x.pts[n-1].p,prev=n>1?x.pts[n-2].p:null,dv=prev===null?'':last>prev?`<span style="color:var(--sage-d)">▲${last-prev}</span>`:last<prev?`<span style="color:var(--red)">▼${prev-last}</span>`:'<span class="muted">-</span>';return `<span class="ci"><i style="background:${x.c}"></i>${x.k} <b>${last}점</b> ${dv} <span class="muted">평균 ${avg(x.pts)}</span></span>`}).join('');
  return `<div class="chartbox"><div class="cleg">${leg}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${lab}${lines}</svg><p class="muted" style="font-size:11.5px;margin:2px 0 0">100점 환산 · 점선은 80점 · 점에 손가락/커서를 대면 시험 이름이 보여요</p></div>`;
}

/* 월간 학부모 리포트 */
function ymAdd(ym,n){const [y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function reportData(sid,ym){
  const inM=d=>d&&d.slice(0,7)===ym;

  const ex=DB.E.filter(e=>e.res&&e.res[sid]&&inM(e.date)).sort((a,b)=>a.date<b.date?-1:1).map(e=>({t:e.title,d:e.date,p:examScore(e,sid).pct}));

  return {logs,att,hw:hw.length,hwDone,hwRate:hw.length?Math.round(hwDone/hw.length*100):null,vn:vr.length,vAvg:vr.length?Math.round(vr.reduce((a,b)=>a+b,0)/vr.length):null,ex,sc};
}
function reportMsg(sid,ym,cm){

  let o=`[포워드 영어학원] ${s.name} 학생 ${m}월 학습 리포트\n\n`;
  o+=`📅 출결: ${r.logs.length?`수업 ${r.logs.length}회`:'수업 일지 기록 없음'}`+(r.logs.length?` (출석 ${r.att.출석}${r.att.지각?` · 지각 ${r.att.지각}`:''}${r.att.결석?` · 결석 ${r.att.결석}`:''})`:'')+'\n';
  o+=`📚 숙제: ${r.hw?`${r.hwDone}/${r.hw}개 완료 (${r.hwRate}%)`:'기록 없음'}\n`;
  o+=`✏️ 단어 시험: ${r.vn?`${r.vn}회 · 평균 ${r.vAvg}점`:'기록 없음'}\n`;
  if(r.ex.length)o+=`📝 학원 시험\n${r.ex.map(e=>`- ${e.t}: ${e.p}점`).join('\n')}\n`;
  if(r.sc.length)o+=`🏫 학교·모의고사\n${r.sc.map(e=>`- ${e.t}: ${e.v}`).join('\n')}\n`;
  const topics=r.logs.filter(l=>l.att!=='결석'&&l.content&&l.content.trim()).map(l=>`- ${+l.date.slice(5,7)}/${+l.date.slice(8)} ${l.content.trim().split('\n')[0].slice(0,40)}`);
  if(topics.length)o+=`\n📖 이번 달 수업 내용\n${topics.join('\n')}\n`;
  if(cm&&cm.trim())o+=`\n💬 선생님 한마디\n${cm.trim()}\n`;
  return o+`\n${t.name?t.name+' 선생님 · ':''}포워드 영어학원 053-716-0859`;
}

function saveBulk(){
  const defT=$('#bk-t').value, rows=$('#bk-t2').value.split('\n').map(l=>l.replace(/^﻿/,'').split(/[,\t]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&r[0]!=='이름');
  const WDN={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
  const findT=n=>{if(!n)return defT;const t=DB.T.find(x=>x.name===n||(n==='원장'&&x.role==='owner'));return t?t.id:defT};
  const added=[],updated=[],clash=[];
  rows.forEach(r=>{
    const [name,school='',grade='',phone='',parent='',tn='',days='',fixed='']=r;
    const dd=[...new Set(days.split('').map(d=>WDN[d]).filter(d=>d!==undefined))];
    const ex=DB.S.find(s=>s.name===name&&(last4(s.phone)===last4(phone)||!s.phone));
    if(ex){Object.assign(ex,{school:school||ex.school,grade:grade||ex.grade,phone:phone||ex.phone,parent:parent||ex.parent});if(tn)ex.tid=findT(tn);if(dd.length)ex.days=dd;updated.push(ex);return}
    let code=/^\d{8,9}$/.test(fixed)?fixed:genCode(phone);
    const other=DB.S.find(s=>s.code===code);
    if(other){clash.push({name,code,with:other.name});code=code+'1';}
    const s={id:'s'+uid(),name,school,grade,phone,parent,tid:findT(tn),days:dd,reg:TODAY,code};DB.S.push(s);added.push(s);
  });

  modal(`<h3 class="jua">${added.length}명 등록 · ${updated.length}명 정보 갱신 🎉</h3><p class="muted" style="font-size:13.5px;margin:4px 0 10px">학생코드 = ${codeYear()} + 학생 휴대폰 뒷번호 4자리</p>
  ${clash.length?`<div style="background:var(--peach-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px">⚠️ 휴대폰 뒷번호가 겹쳐서 코드 끝에 1을 붙였어요: ${clash.map(c=>esc(c.name)+' ('+esc(c.with)+'와 겹침)').join(', ')}</div>`:''}
  ${added.length?`<div class="tbwrap"><table class="tb"><tr><th>이름</th><th>학생코드</th></tr>${added.map(s=>`<tr><td>${esc(s.name)}</td><td style="font-family:monospace;font-weight:700">${s.code}</td></tr>`).join('')}</table></div>`:''}

}

function editTch(id){
  const t=tch(id);
  modal(`<h3 class="jua">${t.role==='owner'?'원장':'강사'} 정보 수정</h3><label class="lb">이름 (로그인할 때 쓰는 이름)</label><input class="inp" id="et-n" value="${esc(t.name)}"><label class="lb">새 비밀번호 (바꿀 때만 입력)</label><input class="inp" id="et-p" type="password" placeholder="그대로 두려면 비워두세요" autocomplete="new-password">
  <div class="btns">${t.role!=='owner'?`<button class="btn btn-warn" onclick="if(DB.S.some(s=>sTid(s)==='${id}')){toast('담당 학생을 다른 선생님께 먼저 옮겨 주세요')}else if(this.dataset.c){DB.T=DB.T.filter(x=>x.id!=='${id}');save();closeModal();render();toast('삭제했어요')}else{this.dataset.c=1;this.textContent='정말 삭제?'}">삭제</button>`:''}<button class="btn btn-ghost" onclick="tryCloseModal()">취소</button><button class="btn btn-navy" onclick="const n=$('#et-n').value.trim(),p=$('#et-p').value;if(!n)return;const x=tch('${id}');x.name=n;if(p)x.pw=p;save();closeModal();render();toast('저장했어요')">저장</button></div>`);
}
function resetAll(b){
  if(!b.dataset.c){b.dataset.c=1;b.textContent='정말 전부 지울까요? 한 번 더 누르세요';return}
  const me=tch(ME.id);
  DB=Object.assign(emptyDB(),{T:DB.T,TPL:DB.TPL});save();render();toast('깨끗하게 비웠어요. 반부터 만들어 주세요');
}

/* ---------- 시작 ---------- */
/* ----- 오늘 접속 기록 ----- */
function trackVisit(){
  if(!ME)return;const id=TODAY+'|'+ME.id,now=Date.now();let a=DB.A.find(x=>x.id===id);
  if(a&&now-(a.t||0)<30*60000)return;
  if(!a){a={id,sid:ME.id,date:TODAY,role:ME.role,n:0,first:nowStr()};DB.A.push(a)}
  a.n=(a.n||0)+1;a.t=now;a.last=nowStr();save();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(trackVisit,1500)});
async function loadHits(){if(!ONLINE||!TOKEN||!ME||ME.role==='student')return;try{const j=await rpc('fw_stats',{p_token:TOKEN});UI.hits=j}catch(e){}}
function visitCard(){
  const a=DB.A.filter(x=>x.date===TODAY), st=a.filter(x=>x.role==='student'), tc=a.filter(x=>x.role!=='student');
  const h=UI.hits||{};
  return `<div class="visit"><span class="lv">● LIVE</span><b>👀 오늘 접속</b>
    <span>🏠 홈페이지 방문 <b>${h.home!=null?h.home:'-'}</b>회</span>
    <span>👩‍🎓 학생 <b>${st.length}</b>명 <small>(${st.reduce((x,y)=>x+(y.n||1),0)}회)</small></span>
    <span>🧑‍🏫 선생님 <b>${tc.length}</b>명</span>
    <button class="btn btn-ghost btn-sm" onclick="UI.vopen=!UI.vopen;render()">${UI.vopen?'접기':'누가 들어왔나 보기'}</button>
    ${UI.vopen?`<div class="vlist2">${a.sort((x,y)=>x.last<y.last?1:-1).map(x=>{const p=x.role==='student'?stu(x.sid):tch(x.sid);return p?`<span>${x.role==='student'?'👩‍🎓':'🧑‍🏫'} ${esc(p.name)} <small>${esc((x.last||'').slice(11,16))} · ${x.n||1}회</small></span>`:''}).join('')||'<span class="muted">아직 없어요</span>'}</div>`:''}</div>`;
}
function afterLoad(){
  const got=processEvents();
  clearTimeout(window.__bootT);try{navRestoreOnLoad();render()}catch(e){console.error(e);UI={};VS.view='home';render()}setTimeout(()=>{pushResync();if(sunPop())return;if(!(got&&ME&&ME.role==='student'))pushPrompt()},1200);trackVisit();loadHits().then(()=>{if(UI.tv==='home'&&!busyTyping())render()});
  if(got&&ME&&ME.role==='student'){setTimeout(()=>petCelebrate(got.r,'🍤',`단어 시험 ${got.e.score}/${got.e.n} 통과! 간식 맛있다냥 🍤`),300);toast('단어 시험 통과! 플래너가 체크되고 콩떡이에게 간식을 줬어요 🍤')}
}
load();
if(ONLINE&&TOKEN){loadingView();sha(TOKEN).then(f=>{FOLDER=f;return pullNow(true)}).then(()=>{if(TOKEN)afterLoad()}).catch(e=>bootTrouble('화면을 여는 중 문제가 생겼어요: '+(e&&e.message||e)+' — 이 화면을 캡처해서 알려주세요'))}
else if(ONLINE){render()}
else{const got=processEvents();
navRestoreOnLoad();render();
if(got&&ME&&ME.role==='student'){setTimeout(()=>petCelebrate(got.r,'🍤',`단어 시험 ${got.e.score}/${got.e.n} 통과! 간식 맛있다냥 🍤`),300);toast('단어 시험 통과! 플래너가 체크되고 콩떡이에게 간식을 줬어요 🍤')}
}
window.addEventListener('pageshow',e=>{if(ONLINE&&(!TOKEN||!e.persisted))return;const g=processEvents();if(g){render();setTimeout(()=>petCelebrate(g.r,'🍤','단어 시험 통과! 간식 맛있다냥 🍤'),300)}});
</script>
